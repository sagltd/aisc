name: Bug report
description: Report incorrect or unsafe behavior
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Command and sanitized output
      description: Remove repository contents, transcripts, tokens and private paths.
      render: shell
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: AISC version, OS, Git version
      placeholder: "aisc 0.1.0, macOS 15, git 2.50"
    validations:
      required: true
