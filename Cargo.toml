[package]
name = "aisc"
version = "0.1.2"
edition = "2024"
rust-version = "1.91.1"
description = "Bounded, task-oriented source control for agents, backed by Git"
license = "MIT"
repository = "https://github.com/sagltd/aisc"
homepage = "https://github.com/sagltd/aisc"
documentation = "https://github.com/sagltd/aisc#readme"
readme = "README.md"
keywords = ["git", "agents", "cli", "source-control", "ai"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/", "benchmarks/", "docs/", "skills/", "CLAUDE.md", "AGENTS.md", ".lead/", ".worktrees/", ".co-op/"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
# In-process object, reference and index access (no network, no default features).
gix-hash = { version = "0.27", default-features = false, features = ["sha1"] }
gix-index = { version = "0.52", default-features = false, features = ["sha1"] }
gix-object = { version = "0.61", default-features = false, features = ["sha1"] }
gix-odb = { version = "0.81", default-features = false }
gix-path = { version = "0.12", default-features = false }
gix-ref = { version = "0.64", default-features = false, features = ["sha1"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3.23"

[profile.release]
lto = true
codegen-units = 1
strip = true
